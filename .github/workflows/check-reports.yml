name: check-reports

# Polls the okoli-52bf6 Firestore `reports` collection and e-mails an alert for any report
# not yet notified. Runs on GitHub's infrastructure so it does not depend on any local machine
# being powered on. Secrets are configured in the repo: Settings -> Secrets and variables ->
# Actions.

on:
  schedule:
    # 37 min past every hour (UTC). Deliberately off the top of the hour: GitHub heavily
    # delays or silently drops scheduled runs queued at :00 on the free plan. GitHub may
    # still delay scheduled runs by a few minutes under load.
    - cron: "37 * * * *"
  workflow_dispatch: {}

# Never run two checks at once (they'd race on the `notified` flag; harmless but pointless).
concurrency:
  group: check-reports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --omit=dev

      - run: node check-reports.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
