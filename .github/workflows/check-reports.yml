name: check-reports

# Polls two Firestore collections and e-mails an alert for any report not yet notified:
#   - check-reports.js         -> okoli-52bf6  / `reports`   (Okolí)
#   - check-reports-mihnuti.js -> mihnuti-398ef / `nahlaseni` (Mihnutí)
# Runs on GitHub's infrastructure so it does not depend on any local machine being powered on.
# Secrets are configured in the repo: Settings -> Secrets and variables -> Actions.

on:
  schedule:
    # 37 min past every hour (UTC). Deliberately off the top of the hour: GitHub heavily
    # delays or silently drops scheduled runs queued at :00 on the free plan. GitHub may
    # still delay scheduled runs by a few minutes under load.
    - cron: "37 * * * *"
  workflow_dispatch: {}

# Never run two checks at once (they'd race on the `notified` flag; harmless but pointless).
concurrency:
  group: check-reports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --omit=dev

      - name: Okolí (reports)
        run: node check-reports.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

      # Runs even if the Okolí step failed, so one app's outage can't mute the other's alerts.
      - name: Mihnutí (nahlaseni)
        if: always()
        run: node check-reports-mihnuti.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON_MIHNUTI }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
